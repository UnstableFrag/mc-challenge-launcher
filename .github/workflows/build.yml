name: Build Launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mod:
    name: Build Java Mod (${{ matrix.mc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.20.1, 1.20.2, 1.20.4, 1.20.6, 1.21, 1.21.1, 1.21.2, 1.21.3, 1.21.4, 1.21.5, 1.21.6, 1.21.7, 1.21.8, 1.21.9, 1.21.10, 1.21.11]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.6.1'          # Loom 1.17 требует Gradle 9.2+

      - name: Build challenge-mod for ${{ matrix.mc }}
        working-directory: ./challenge-mod
        run: gradle build -Pmc=${{ matrix.mc }} --no-daemon

      - name: Verify jar exists
        shell: bash
        run: |
          ls challenge-mod/build/libs/ || true
          test -f challenge-mod/build/libs/challenge-hud-${{ matrix.mc }}.jar && echo "OK" || echo "MISSING"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: challenge-mod-${{ matrix.mc }}
          path: challenge-mod/build/libs/challenge-hud-${{ matrix.mc }}.jar
          if-no-files-found: error

  build-launcher:
    name: Build Rust Launcher (Windows)
    runs-on: windows-latest
    needs: build-mod
    steps:
      - uses: actions/checkout@v4

      - name: Download all mod jars
        uses: actions/download-artifact@v4
        with:
          path: modjars/

      - name: Place mod jars into assets/challenge-mod/
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force assets/challenge-mod -ErrorAction SilentlyContinue
          Remove-Item -Force assets/challenge-mod.jar -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path assets/challenge-mod | Out-Null
          $jars = Get-ChildItem -Recurse modjars -Filter challenge-hud-*.jar
          if ($jars.Count -eq 0) { throw "No mod jars found in modjars/" }
          foreach ($jar in $jars) {
            Copy-Item -Path $jar.FullName -Destination "assets/challenge-mod/$($jar.Name)" -Force
          }
          Get-ChildItem assets/challenge-mod | Select-Object Name, Length

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build launcher
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload Windows .exe
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: target/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-mod, build-launcher]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download launcher
        uses: actions/download-artifact@v4
        with:
          name: launcher-windows
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
