name: Build Launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mod:
    name: Build Java Mod (Architectury)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.6.1'          # Loom 1.17 требует Gradle 9.2+

      - name: Build challenge-mod
        working-directory: ./challenge-mod
        run: gradle build --no-daemon      # build, а не jar → соберёт remapJar

      - name: Debug list output
        if: always()
        shell: bash
        run: ls -R challenge-mod/build/libs || true

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: challenge-mod
          path: |
            challenge-mod/build/libs/*.jar
            !challenge-mod/build/libs/*-dev.jar
            !challenge-mod/build/libs/*-sources.jar
          if-no-files-found: error          # падать явно, если jar нет

  build-launcher:
    name: Build Rust Launcher (Windows)
    runs-on: windows-latest
    needs: build-mod
    steps:
      - uses: actions/checkout@v4

      - name: Download challenge-mod.jar
        uses: actions/download-artifact@v4
        with:
          name: challenge-mod
          path: assets/

      - name: Rename mod jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem assets/*.jar | Select-Object -First 1
          if (-not $jar) { throw "No mod jar found in assets/" }
          Rename-Item -Path $jar.FullName -NewName "challenge-mod.jar"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build launcher
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload Windows .exe
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: target/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-mod, build-launcher]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download launcher
        uses: actions/download-artifact@v4
        with:
          name: launcher-windows
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true