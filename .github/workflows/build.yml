name: Build Launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mod:
    name: Build Java Mod (${{ matrix.mc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [1.16.5, 1.17.1, 1.18.2, 1.19.2, 1.19.3, 1.19.4, 1.20.1, 1.20.2, 1.20.4, 1.20.6, 1.21, 1.21.1, 1.21.2, 1.21.3, 1.21.4, 1.21.5, 1.21.6, 1.21.7, 1.21.8, 1.21.9, 1.21.10, 1.21.11]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.6.1'          # Loom 1.17 требует Gradle 9.2+

      - name: Build challenge-mod for ${{ matrix.mc }}
        working-directory: ./challenge-mod
        run: gradle build -Pmc=${{ matrix.mc }} --no-daemon

      # Контракт jar-ов на строку матрицы (22 версии):
      #   challenge-hud-<mc>.jar          — Fabric, всегда (все 22)
      #   challenge-hud-<mc>-forge.jar    — только 1.16.5, 1.17.1, 1.18.2, 1.19.2, 1.19.3, 1.19.4, 1.20.1, 1.20.2, 1.20.4 (9)
      #   challenge-hud-<mc>-neoforge.jar — только 1.20.2, 1.20.4, 1.20.6, 1.21, 1.21.1–1.21.11 (15)
      # Проверяем не только наличие файла, но и что в нём есть классы мода
      # (защита от пустых/битых jar — такая проблема в этом репо уже была).
      - name: Verify jars contain the mod classes
        shell: bash
        run: |
          set -euo pipefail
          MC=${{ matrix.mc }}

          # Матрица поддержки лоадеров (зеркалит Versions.isForgeSupported/isNeoSupported)
          FORGE_EXPECTED=0; NEOFORGE_EXPECTED=0
          case "$MC" in
            1.16.5|1.17.1|1.18.2|1.19.2|1.19.3|1.19.4|1.20.1|1.20.2|1.20.4) FORGE_EXPECTED=1 ;;
          esac
          case "$MC" in
            1.20.2|1.20.4|1.20.6|1.21|1.21.1|1.21.2|1.21.3|1.21.4|1.21.5|1.21.6|1.21.7|1.21.8|1.21.9|1.21.10|1.21.11) NEOFORGE_EXPECTED=1 ;;
          esac

          find_jar() {
            local name="$1"
            find challenge-mod -type f -path "*/build/libs/$name" -print -quit
          }

          check_jar() {
            local jar="$1"; shift
            [ -f "$jar" ] || { echo "::error::Expected jar missing: $jar"; exit 1; }
            local cls
            for cls in "$@"; do
              if unzip -l "$jar" | grep -q "$cls"; then
                echo "OK: $(basename "$jar") contains $cls"
              else
                echo "::error::$(basename "$jar") does not contain $cls (empty/broken jar?)"
                exit 1
              fi
            done
          }

          echo "== Produced jars =="
          find challenge-mod -type f -path '*/build/libs/challenge-hud-*.jar'
          echo "==================="

          # Fabric — всегда (common класс + fabric entrypoint)
          FABRIC=$(find_jar "challenge-hud-${MC}.jar")
          check_jar "$FABRIC" "challengehud/ChallengeHud\.class" "ChallengeHudFabric\.class"

          # Forge — только 1.16.5–1.20.4 (в старых jar внутри также EraBridge + WinScreen/TimeoutScreen)
          FORGE=$(find_jar "challenge-hud-${MC}-forge.jar")
          if [ "$FORGE_EXPECTED" = "1" ]; then
            check_jar "$FORGE" "challengehud/ChallengeHud\.class" "ChallengeHudForge\.class"
          elif [ -n "$FORGE" ]; then
            echo "WARN: unexpected forge jar produced for $MC: $FORGE"
          fi

          # NeoForge — только 1.20.2–1.21.11
          NEOFORGE=$(find_jar "challenge-hud-${MC}-neoforge.jar")
          if [ "$NEOFORGE_EXPECTED" = "1" ]; then
            check_jar "$NEOFORGE" "challengehud/ChallengeHud\.class" "ChallengeHudNeoForge\.class"
          elif [ -n "$NEOFORGE" ]; then
            echo "WARN: unexpected neoforge jar produced for $MC: $NEOFORGE"
          fi

          echo "== VERIFIED: challenge-hud-${MC} (fabric + expected loaders) =="

      # Все jar-ы строки матрицы одним артефактом (fabric всегда; forge/neoforge по матрице
      # поддержки версии). Один шаг = одно имя: upload-artifact@v4 падает с 409 при
      # повторной заливке под тем же именем в одном workflow run.
      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: challenge-mod-${{ matrix.mc }}
          path: |
            challenge-mod/**/build/libs/challenge-hud-${{ matrix.mc }}.jar
            challenge-mod/**/build/libs/challenge-hud-${{ matrix.mc }}-forge.jar
            challenge-mod/**/build/libs/challenge-hud-${{ matrix.mc }}-neoforge.jar
          if-no-files-found: error

  build-launcher:
    name: Build Rust Launcher (Windows)
    runs-on: windows-latest
    needs: build-mod
    steps:
      - uses: actions/checkout@v4

      - name: Download all mod jars
        uses: actions/download-artifact@v4
        with:
          path: modjars/

      - name: Place mod jars into assets/challenge-mod/
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force assets/challenge-mod -ErrorAction SilentlyContinue
          Remove-Item -Force assets/challenge-mod.jar -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path assets/challenge-mod | Out-Null
          $jars = Get-ChildItem -Recurse modjars -Filter challenge-hud-*.jar
          if ($jars.Count -eq 0) { throw "No mod jars found in modjars/" }
          foreach ($jar in $jars) {
            Copy-Item -Path $jar.FullName -Destination "assets/challenge-mod/$($jar.Name)" -Force
          }
          Get-ChildItem assets/challenge-mod | Select-Object Name, Length

      # embed.rs инжектит все 46 jar-ов в .exe (include_bytes); отсутствующий файл
      # ломает билд Rust, поэтому проверяем полный манифест ДО cargo build.
      - name: Assert all 46 expected jars are present
        shell: pwsh
        run: |
          $expected = @(
            # Fabric (22) — все версии
            'challenge-hud-1.16.5.jar',
            'challenge-hud-1.17.1.jar',
            'challenge-hud-1.18.2.jar',
            'challenge-hud-1.19.2.jar',
            'challenge-hud-1.19.3.jar',
            'challenge-hud-1.19.4.jar',
            'challenge-hud-1.20.1.jar',
            'challenge-hud-1.20.2.jar',
            'challenge-hud-1.20.4.jar',
            'challenge-hud-1.20.6.jar',
            'challenge-hud-1.21.jar',
            'challenge-hud-1.21.1.jar',
            'challenge-hud-1.21.2.jar',
            'challenge-hud-1.21.3.jar',
            'challenge-hud-1.21.4.jar',
            'challenge-hud-1.21.5.jar',
            'challenge-hud-1.21.6.jar',
            'challenge-hud-1.21.7.jar',
            'challenge-hud-1.21.8.jar',
            'challenge-hud-1.21.9.jar',
            'challenge-hud-1.21.10.jar',
            'challenge-hud-1.21.11.jar',
            # Forge (9)
            'challenge-hud-1.16.5-forge.jar',
            'challenge-hud-1.17.1-forge.jar',
            'challenge-hud-1.18.2-forge.jar',
            'challenge-hud-1.19.2-forge.jar',
            'challenge-hud-1.19.3-forge.jar',
            'challenge-hud-1.19.4-forge.jar',
            'challenge-hud-1.20.1-forge.jar',
            'challenge-hud-1.20.2-forge.jar',
            'challenge-hud-1.20.4-forge.jar',
            # NeoForge (15)
            'challenge-hud-1.20.2-neoforge.jar',
            'challenge-hud-1.20.4-neoforge.jar',
            'challenge-hud-1.20.6-neoforge.jar',
            'challenge-hud-1.21-neoforge.jar',
            'challenge-hud-1.21.1-neoforge.jar',
            'challenge-hud-1.21.2-neoforge.jar',
            'challenge-hud-1.21.3-neoforge.jar',
            'challenge-hud-1.21.4-neoforge.jar',
            'challenge-hud-1.21.5-neoforge.jar',
            'challenge-hud-1.21.6-neoforge.jar',
            'challenge-hud-1.21.7-neoforge.jar',
            'challenge-hud-1.21.8-neoforge.jar',
            'challenge-hud-1.21.9-neoforge.jar',
            'challenge-hud-1.21.10-neoforge.jar',
            'challenge-hud-1.21.11-neoforge.jar'
          )
          if ($expected.Count -ne 46) {
            Write-Host "::error::Manifest count is $($expected.Count), expected 46"
            exit 1
          }
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath (Join-Path 'assets/challenge-mod' $_)) })
          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing $($missing.Count) of $($expected.Count) expected jars: $($missing -join ', ')"
            exit 1
          }
          $actual = @(Get-ChildItem -LiteralPath 'assets/challenge-mod' -Filter 'challenge-hud-*.jar' -File)
          if ($actual.Count -ne $expected.Count) {
            $names = ($actual | Select-Object -ExpandProperty Name) -join ', '
            Write-Host "::error::Expected exactly $($expected.Count) jars in assets/challenge-mod, found $($actual.Count): $names"
            exit 1
          }
          Write-Host "== All $($expected.Count) expected jars present in assets/challenge-mod =="

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build launcher
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload Windows .exe
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: target/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-mod, build-launcher]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download launcher
        uses: actions/download-artifact@v4
        with:
          name: launcher-windows
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
