[package]
name = "mc-challenge-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
notify = "6.1"
walkdir = "2.3"
zip = "0.6"
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
open = "5.0"
tempfile = "3.5"
include_dir = "0.7"
textwrap = "0.16"
clap = { version = "4.4", features = ["derive"] }